<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spiralGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Dark Cosmic Circle Background -->
  <circle cx="24" cy="24" r="22" fill="#020617" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Sacred Geometry Spirals -->
  <ellipse cx="24" cy="24" rx="18" ry="8" fill="none" stroke="url(#spiralGold)" stroke-width="1.5" transform="rotate(-25 24 24)" opacity="0.85"/>
  <ellipse cx="24" cy="24" rx="13" ry="5.5" fill="none" stroke="#06b6d4" stroke-width="1.2" transform="rotate(35 24 24)" opacity="0.75"/>

  <!-- Past Blue Node -->
  <circle cx="10" cy="18" r="2.5" fill="#3b82f6"/>
  <circle cx="10" cy="18" r="4.5" fill="#3b82f6" opacity="0.3"/>

  <!-- Future Magenta Node -->
  <circle cx="38" cy="30" r="2.5" fill="#d946ef"/>
  <circle cx="38" cy="30" r="4.5" fill="#d946ef" opacity="0.3"/>

  <!-- Emergence Gold Star Node -->
  <circle cx="24" cy="7" r="2" fill="#f59e0b"/>
  <circle cx="24" cy="7" r="4" fill="#f59e0b" opacity="0.4"/>

  <!-- Central Present Moment Core -->
  <circle cx="24" cy="24" r="7" fill="url(#centerGlow)"/>
  <circle cx="24" cy="24" r="2.2" fill="#ffffff"/>
</svg>
